<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E6E6E1">
<title>Plans and exercises · prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="../shared/base.css">
<style>
/* Slice: routines (UC05), programs (UC24), exercise search (UC03), custom exercise (UC04), per-exercise settings (UC14). */
.view{flex:1;display:flex;flex-direction:column;min-height:0}
.view.enter .scroll{animation:viewin .24s var(--ease) both}
@keyframes viewin{from{transform:translateY(12px);opacity:0}}
.dayrow .n{font-size:var(--t-num);width:24px;text-align:center;line-height:1;flex:none}
.dayrow .start{min-height:40px;padding:0 12px}
.exrow{align-items:flex-start;padding-top:12px;padding-bottom:12px}
.exrow .n{font-size:var(--t-num);width:24px;text-align:center;line-height:1;flex:none;padding-top:2px}
.exrow .spec{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font-size:var(--t-label);font-weight:600}
.exrow .spec b{font-family:'Barlow Condensed';font-weight:800;font-size:var(--t-read);letter-spacing:0}
.exrow{padding-right:28px}
.exrow .grip,.dayrow .grip{align-self:center}
/* superset: a dashed bracket on the right edge joins the grouped rows (DESIGN.md: dashed = group) */
.exrow.ss::after{content:"";position:absolute;right:10px;top:0;bottom:0;width:8px;border-right:1.5px dashed var(--ink)}
.exrow.ss.ss-first::after{top:14px;border-top:1.5px dashed var(--ink);border-top-right-radius:6px}
.exrow.ss.ss-last::after{bottom:14px;border-bottom:1.5px dashed var(--ink);border-bottom-right-radius:6px}
.exrow.ss + .exrow.ss{border-top-style:dashed}
.sstag{display:block;font-size:var(--t-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.reorder-hint{display:flex;align-items:center;gap:6px}
.reorder-hint svg{width:16px;height:16px}
.range{display:flex;align-items:center;gap:8px}
.range .num{font-size:var(--t-num)}
.tpl .band .setno{font-size:var(--t-num)}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;padding:14px 16px 4px}
.facts div{min-width:64px}
.facts .num{font-size:var(--t-num);line-height:1;display:block}
.tpl p.blurb{padding:4px 16px 14px}
.daycol{padding:4px 16px 12px}
.daycol h3{font-size:var(--t-read);font-weight:700;margin:8px 0 4px}
.daycol li{list-style:none;display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--rule-soft)}
.daycol li span:last-child{font-size:var(--t-label);font-weight:700;letter-spacing:.06em;white-space:nowrap}
.match{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-label);font-weight:700;letter-spacing:.06em}
.match i{width:8px;height:8px;border-radius:50%;background:var(--orange)}
/* picker sheet: search and muscle chips stay pinned while the results scroll */
.pickhd{position:sticky;top:0;z-index:1;background:var(--tyvek);display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:2px 0 8px;margin-bottom:4px;border-bottom:1px solid var(--rule-soft)}
.lib .tag{font-size:var(--t-label);font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.alias{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.alias span{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 4px 0 10px;border-radius:999px;border:1.5px solid var(--ink);font-size:var(--t-label);font-weight:600}
.alias span.shared{border-color:var(--rule);padding-right:10px}
.alias button{width:28px;height:28px;display:grid;place-items:center}
.alias svg{width:14px;height:14px}
.names{padding:16px}
.names b{display:block;font-size:var(--t-read)}
.names .sm{font-size:var(--t-label);font-weight:600}
.skelrow{display:flex;gap:12px;align-items:center;min-height:56px;padding:0 16px;border-top:1px solid var(--rule-soft)}
.skelrow:first-child{border-top:0}
</style>
</head>
<body>
<div class="stage">
  <aside class="demo-panel" aria-label="Prototype controls">
    <h2>Prototype · sample data</h2>
    <p>Routines (UC05), programs (UC24), exercise search (UC03), custom exercises (UC04) and per-exercise settings (UC14). Not wired to Dexie or the API.</p>
    <div class="demo-list" data-demo></div>
  </aside>
  <div class="app" id="app"><div class="view" id="view"></div></div>
</div>
<script src="../shared/kit.js"></script>
<script src="../shared/data.js"></script>
<script src="../shared/sortable.js"></script>
<script>
const {$, $$, ic, esc, fmt, parse, plural, norm, openSheet, closeSheet, sheetOpen, toast, announce, demo, renderDemo, openDemo, shellMarkup, demoBtn, navFoot, resumeBar, syncPill} = Kit;
const D = DATA;
document.getElementById('app').insertAdjacentHTML('beforeend', shellMarkup);

const clone = o => JSON.parse(JSON.stringify(o));
const S = {plans:clone(D.PLANS), custom:[], online:true, pending:0, session:false, empty:false, tplError:false, loading:false, q:'', muscle:null, settings:{}, aliases:{bench:['flat bench']}};
const ex = id => D.ex(id) || S.custom.find(c => c.id === id);
const plan = id => S.plans.find(p => p.id === id);
const LOADS = D.LOAD;
const STEPS = [0.5, 1, 1.25, 2, 2.5, 5, 10];
const settingsOf = id => Object.assign({step:ex(id).step, load:ex(id).load, bar:ex(id).bar, auto:true}, S.settings[id]);
const lastOf = id => { for (const s of D.SESSIONS){ const e = s.exs.find(x => x.id === id); if (e) return {date:s.start, sets:e.sets}; } return null; };

/* ---------- routing ---------- */
const route = () => location.hash.replace(/^#\/?/, '').split('/');
addEventListener('hashchange', ev => {
  closeSheet();
  const was = (ev.oldURL.split('#')[1] || '').split('/');
  if (was[0] === 'day' && was[2] === 'new' && S.draftDay && route()[2] !== 'new'){
    const dr = S.draftDay; S.draftDay = null;
    if (dr.ex.length || dr.touched){ S.lostDraft = {pid:was[1], dr}; setTimeout(() => toast(`${esc(dr.name)} wasn’t added. <button data-act="draft-back">Keep editing</button>`, 5000), 60); }
  }
  render(true);
});
function nav(h){ location.hash = h; }

function topBar({back, title, sub, right = ''}){
  return `<header class="top">${back != null ? `<a class="icon-btn back" href="#${back}" aria-label="Back">${ic('left')}</a>` : ''}
    <div class="ttl"><h1>${title}</h1>${sub ? `<div class="sub">${sub}</div>` : ''}</div>
    <div class="right">${right}<div class="sync" id="sync" role="status"></div>${demoBtn}</div></header>
    ${S.session ? resumeBar({name:'Push A', elapsed:'31:12', done:5}) : ''}`;
}

function render(enter){
  const [r, a, b] = route();
  const v = ({'':plansView, plan:planView, day:dayView, new:newView, templates:templatesView, template:templateView, exercises:libraryView, exercise:exerciseView, custom:customView})[r] || plansView;
  const el = $('#view');
  el.className = 'view' + (enter && !Kit.reduce ? ' enter' : '');
  el.innerHTML = v(a, b);
  syncPill($('#sync'), S);
  renderDemo();
}

/* ---------- Plans root ---------- */
function plansView(){
  const active = S.plans.find(p => p.active);
  const others = S.plans.filter(p => !p.active);
  if (S.empty) return `${topBar({title:'Plans'})}
    <main class="scroll"><section class="bib"><div class="band open"><span class="name">No routine yet</span></div>
      <div class="empty"><span class="bigstat num">0</span><p>Type in the routine you already follow, or start from a program.</p>
      <div class="acts" style="justify-content:center"><a class="btn ink" href="#new">${ic('edit')}Write my routine</a><a class="btn line" href="#templates">Browse programs</a></div></div></section>
      ${libraryRow()}</main>
    ${navFoot('plans')}`;
  return `${topBar({title:'Plans'})}
  <main class="scroll">
    <section class="bib" aria-label="Active routine">
      <div class="band open"><span class="name">${esc(active.name)} · active</span><a class="icon-btn more" href="#plan/${active.id}" aria-label="Edit ${esc(active.name)}">${ic('edit')}</a></div>
      <div class="block">${active.days.map((d, i) => `<div class="row dayrow"><b class="n num">${i + 1}</b><a class="nm" href="#day/${active.id}/${d.id}" style="text-decoration:none">${esc(d.name)}<small>${d.ex.map(e => ex(e.id).name).slice(0, 3).join(', ')}${d.ex.length > 3 ? ` +${d.ex.length - 3}` : ''}</small></a>
        <a class="btn line start" href="../workout-log/index.html" aria-label="Start ${esc(d.name)}">${ic('play')}Start</a></div>`).join('')}</div>
      <div class="perf"><i></i></div>
      ${(() => { const li = active.days.findIndex(x => x.id === D.SESSIONS[0].dayId), nx = active.days[(li + 1) % active.days.length], lastName = li >= 0 ? active.days[li].name : null;
        return `<div class="stub"><span class="label">Next up</span><p class="hint">${lastName ? `${esc(nx.name)} comes after ${esc(lastName)}. ` : ''}Days run in this order; start any of them whenever you like.</p><b class="last num">${esc(nx.name).toUpperCase()}</b></div>`; })()}
    </section>
    ${others.length ? `<h2 class="hdg">Other routines</h2><div class="block">${others.map(p => `<a class="row" href="#plan/${p.id}"><span class="nm">${esc(p.name)}<small>${plural(p.days.length, 'day')}${p.template ? ' · from a program' : ''}</small></span>${ic('right', 'chev')}</a>`).join('')}</div>` : ''}
    <div class="acts" style="margin-top:12px"><a class="btn ink" href="#new">${ic('plus')}New routine</a><a class="btn line" href="#templates">Browse programs</a></div>
    ${libraryRow()}
  </main>
  ${navFoot('plans')}`;
}
const libraryRow = () => `<h2 class="hdg">Exercises</h2><div class="block"><a class="row" href="#exercises">${ic('search')}<span class="nm">Exercise library<small>${D.CATALOG.length} exercises${S.custom.length ? ` + ${S.custom.length} of yours` : ''} · step, logging and bar weight per exercise</small></span>${ic('right', 'chev')}</a></div>`;

/* ---------- Plan editor ---------- */
function planView(id){
  const p = plan(id); if (!p) return plansView();
  return `${topBar({back:'', title:esc(p.name), sub:p.active ? 'Active routine' : 'Routine'})}
  <main class="scroll">
    <div class="block pad">
      <div class="field"><label class="label" for="pname">Routine name</label><input class="in" id="pname" value="${esc(p.name)}" data-bind="plan-name" data-id="${p.id}"></div>
      <div class="field switch"><span>Active routine<small>Today follows the active routine’s days in order.</small></span><button role="switch" aria-checked="${p.active}" data-act="activate" data-id="${p.id}" aria-label="Active routine"></button></div>
    </div>
    ${S.session && p.active ? `<div class="banner" style="margin:12px 0 0">${ic('alert')}<p><b>A workout is in progress</b>Changes apply from your next session. Logged workouts keep the numbers they had.</p></div>` : ''}
    <h2 class="hdg">Days</h2>
    <div class="block"><ol id="dayList" style="list-style:none">${p.days.map((d, i) => `<li class="row dayrow sort-item"><button class="grip" aria-label="Reorder ${esc(d.name)}" aria-pressed="false" aria-describedby="sortHelp">${ic('grip')}</button><b class="n num">${i + 1}</b><a class="nm" href="#day/${p.id}/${d.id}" style="text-decoration:none">${esc(d.name)}<small>${plural(d.ex.length, 'exercise')} · ${plural(d.ex.reduce((a, e) => a + e.sets, 0), 'working set')}</small></a>${ic('right', 'chev')}</li>`).join('')}</ol>
      <button class="row add" data-act="day-add" data-id="${p.id}">${ic('plus')}Add a day</button></div>
    <p class="note reorder-hint" id="sortHelp" style="margin-top:8px">${ic('grip')}Drag the handle to change the order. Today follows it.</p>
    <div class="block" style="margin-top:24px"><button class="row danger" data-act="plan-del" data-id="${p.id}">${ic('trash')}<span class="nm">Delete routine<small>Past workouts stay in your history.</small></span></button></div>
  </main>`;
}

/* ---------- Day editor ---------- */
/* the target follows how the exercise is logged: a rep range, or a time range for timed holds */
const target = (pe, c) => c.metric === 'duration' ? `${Kit.dur(pe.durMin ?? 30)}–${Kit.dur(pe.durMax ?? 60)}` : `${pe.repMin}–${pe.repMax}`;
function exSpec(pe){
  const c = ex(pe.id), k = D.kind(c);
  const start = k === 'wr' ? (pe.initialWeight != null ? `start ${fmt(pe.initialWeight)} kg` : lastOf(pe.id) ? 'start from last time' : 'first set by feel')
    : lastOf(pe.id) ? 'start from last time' : k === 'bw+' ? 'bodyweight to start' : 'first set by feel';
  return `<span><b>${pe.sets} × ${target(pe, c)}</b></span><span>${Kit.mmss(pe.rest * 1000)} rest</span>${pe.warmup ? '<span>warm-up</span>' : ''}<span>${start}</span>`;
}
function dayView(pid, did){
  const p = plan(pid), isNew = did === 'new', d = isNew ? S.draftDay : p?.days.find(x => x.id === did);
  if (!p) return plansView();
  if (!d) return planView(pid);
  const html = d.ex.map((_, i) => exRow(d, i)).join('');
  return `${topBar({back:`plan/${p.id}`, title:esc(d.name), sub:isNew ? 'New day · not saved yet' : esc(p.name)})}
  <main class="scroll">
    <div class="block pad"><div class="field"><label class="label" for="dname">Day name</label><input class="in" id="dname" value="${esc(d.name)}" data-bind="day-name"></div></div>
    <h2 class="hdg">Exercises, in order</h2>
    <div class="block"><div id="exList">${html}</div>${html ? '' : `<div class="empty"><p>No exercises yet. Add the first one you do on this day.</p></div>`}
      <button class="row add" data-act="pick" data-to="day">${ic('plus')}Add exercise</button></div>
    <p class="note reorder-hint" id="sortHelp" style="margin-top:8px">${ic('grip')}Drag the handle to reorder. Tap an exercise for sets, reps and rest.</p>
    <p class="note" style="margin-top:8px">Starting weight is only what you type here. The app never guesses one for an exercise you haven’t logged.</p>
    ${isNew ? `<p class="note" style="margin-top:8px">Not saved yet: the day is added to ${esc(p.name)} when you tap Done. Going back discards it.</p>` : `<div class="block" style="margin-top:24px">${p.days.length > 1
      ? `<button class="row danger" data-act="day-del">${ic('trash')}<span class="nm">Remove this day from the routine<small>Its ${plural(d.ex.length, 'exercise')} go with it. Past workouts stay in History.</small></span></button>`
      : `<div class="row" aria-disabled="true">${ic('trash')}<span class="nm">Remove this day from the routine<small>A routine needs at least one day. Delete the routine instead.</small></span></div>`}</div>`}
  </main>
  <div class="foot">${isNew ? `<button class="go ink" data-act="day-done">Done</button>` : `<a class="go ink" href="#plan/${p.id}">Done</a>`}</div>`;
}
function exRow(d, i){
  const pe = d.ex[i], c = ex(pe.id);
  const first = pe.group && d.ex[i - 1]?.group !== pe.group, last = pe.group && d.ex[i + 1]?.group !== pe.group;
  const ss = pe.group ? ` ss${first ? ' ss-first' : ''}${last ? ' ss-last' : ''}` : '';
  return `<div class="row exrow sort-item${ss}"><button class="grip" aria-label="Reorder ${esc(c.name)}" aria-pressed="false" aria-describedby="sortHelp">${ic('grip')}</button><b class="n num">${i + 1}</b>
    <button class="nm" data-act="ex-edit" data-i="${i}" style="text-align:left">${first ? '<span class="sstag">Superset</span>' : ''}${esc(c.name)}<small>${c.equip} · ${LOADS[settingsOf(pe.id).load] || D.METRIC[c.metric]}</small><span class="spec">${exSpec(pe)}</span></button></div>`;
}
function curDay(){ const [, pid, did] = route(); return did === 'new' ? S.draftDay : plan(pid)?.days.find(x => x.id === did); }
const drafting = () => route()[0] === 'day' && route()[2] === 'new';
function exSheet(i){
  const d = curDay(), pe = d.ex[i], c = ex(pe.id), last = lastOf(pe.id);
  const timed = c.metric === 'duration';
  const nextIn = d.ex[i + 1];
  openSheet(c.name, `
    <div class="field"><span class="label">Working sets</span><div class="stepper"><button data-act="pe" data-k="sets" data-d="-1" aria-label="One set fewer">${ic('minus')}</button><b class="num">${pe.sets}</b><button data-act="pe" data-k="sets" data-d="1" aria-label="One set more">${ic('plus')}</button></div></div>
    ${timed ? `<div class="field"><span class="label">Target time per set</span><div class="range"><input class="in numin" inputmode="numeric" value="${Kit.dur(pe.durMin ?? 30)}" data-pe="durMin" aria-label="Shortest hold, minutes and seconds"><span class="num">–</span><input class="in numin" inputmode="numeric" value="${Kit.dur(pe.durMax ?? 60)}" data-pe="durMax" aria-label="Longest hold, minutes and seconds"></div>
      <p class="help">Type 45 for 0:45, or 130 for 1:30. Reach the top on every set and you’ll get a nudge to go longer.</p></div>`
    : `<div class="field"><span class="label">Rep range</span><div class="range"><input class="in numin" inputmode="numeric" value="${pe.repMin}" data-pe="repMin" aria-label="Fewest reps"><span class="num">–</span><input class="in numin" inputmode="numeric" value="${pe.repMax}" data-pe="repMax" aria-label="Most reps"></div>
      <p class="help">${c.metric === 'weight_reps' ? 'Hit the top on every set and you’ll get a nudge to go up. Fall under the bottom and you’ll get a back-off.' : c.load === 'added_weight' ? 'Hit the top on every set and you’ll get a nudge to add reps or strap on weight.' : 'Hit the top on every set and you’ll get a nudge to add reps or hold a weight.'}</p></div>`}
    ${c.metric === 'weight_reps' ? `<div class="field"><label class="label" for="iw">Starting weight · optional</label><div class="inrow"><input class="in numin" id="iw" inputmode="decimal" placeholder="–" value="${pe.initialWeight ?? ''}" data-pe="initialWeight"><span class="label">kg ${LOADS[settingsOf(pe.id).load].toLowerCase()}</span></div>
      <p class="help">${last ? `Last time: ${fmt(last.sets[0][0])} kg on ${Kit.shortDate(last.date)}. Your next session starts from that, so you can leave this empty.` : 'No history for this exercise. Leave empty to log your first set by feel; the app won’t suggest a number.'}</p></div>` : ''}
    ${c.metric === 'weight_reps' ? `<div class="field switch"><span>Warm-up sets<small>Suggests 50% × 8, 70% × 5, 85% × 2 before the first working set.</small></span><button role="switch" data-act="pe-warm" aria-checked="${pe.warmup}" aria-label="Warm-up sets"></button></div>` : ''}
    <div class="field"><span class="label">Rest between sets</span><div class="stepper"><button data-act="pe" data-k="rest" data-d="-15" aria-label="15 seconds less">${ic('minus')}</button><b class="num">${Kit.mmss(pe.rest * 1000)}</b><button data-act="pe" data-k="rest" data-d="15" aria-label="15 seconds more">${ic('plus')}</button></div></div>
    <div class="menu">
      ${nextIn ? `<button data-act="pe-ss">${ic('link')}<span>${pe.group && nextIn.group === pe.group ? 'Remove superset' : `Superset with ${esc(ex(nextIn.id).name)}`}<small>Alternate sets, rest after each round.</small></span></button>` : ''}
      <button data-act="pick" data-to="swap">${ic('swap')}<span>Change exercise<small>Keeps sets, reps and rest.</small></span></button>
      <a href="#exercise/${pe.id}">${ic('gear')}<span>Exercise settings<small>Weight step, how weight is logged, bar weight.</small></span></a>
      <button class="danger" data-act="pe-del">${ic('trash')}<span>Remove from ${esc(d.name)}</span></button>
    </div>`, {onClose:() => render()});
  S.editing = i;
}

/* ---------- New routine ---------- */
function newView(){
  return `${topBar({back:'', title:'New routine'})}
  <main class="scroll">
    <div class="block pad">
      <div class="field"><label class="label" for="nname">Routine name</label><input class="in" id="nname" placeholder="e.g. Upper / lower" autofocus></div>
      <div class="field"><span class="label">How many days does it have?</span><div class="seg" id="ndays">${[1,2,3,4,5,6].map(n => `<button data-act="ndays" data-v="${n}" aria-pressed="${(S.ndays || 3) === n}">${n}</button>`).join('')}</div>
        <p class="help">Days are named Day 1, Day 2… for now. Rename them as you add exercises.</p></div>
      <div class="field switch"><span>Make it my active routine<small>Today will offer its days in order.</small></span><button role="switch" data-act="nactive" aria-checked="${S.nactive ?? true}" aria-label="Make active"></button></div>
    </div>
    <p class="note">Have it on a screenshot or a note? Type it in here for now; importing from a photo comes later.</p>
  </main>
  <div class="foot"><button class="go" data-act="create">Create and add exercises</button></div>`;
}

/* ---------- Programs ---------- */
function templatesView(){
  const prof = {perWeek:3, equipment:'Gym', level:'Beginner'};
  if (S.loading) return `${topBar({back:'', title:'Programs'})}<main class="scroll"><div class="block">${[1,2,3].map(() => `<div class="skelrow"><span class="skel" style="width:60%;height:14px"></span><span class="skel" style="width:40px;height:24px;margin-left:auto"></span></div>`).join('')}</div></main>`;
  if (S.tplError) return `${topBar({back:'', title:'Programs'})}<main class="scroll"><div class="alert" role="alert">${ic('alert')}<p><b>Programs didn’t load</b>They come from the server the first time. Check your connection and try again.</p></div><div class="acts"><button class="btn ink" data-act="tpl-retry">${ic('refresh')}Try again</button><a class="btn line" href="#new">Write my own instead</a></div></main>`;
  return `${topBar({back:'', title:'Programs'})}
  <main class="scroll">
    <p class="note" style="padding-top:4px">Programs are a starting point. Copy one and it becomes your routine: change any day, exercise or number.</p>
    ${D.TEMPLATES.map(t => {
      const fit = t.perWeek === prof.perWeek && t.equipment === prof.equipment;
      return `<section class="bib tpl"><div class="band ${fit ? '' : 'open'}"><span class="name">${esc(t.name)}</span><b class="setno num">${t.perWeek}×/WK</b></div>
        <div class="facts"><div><span class="num">${t.days.length}</span><span class="label">${t.days.length < t.perWeek ? 'workouts, A/B' : 'workouts'}</span></div><div><span class="num">${t.minutes}</span><span class="label">min</span></div><div><span class="num">${t.days.reduce((a, d) => a + d.ex.length, 0)}</span><span class="label">exercises</span></div>

/* drag to reorder: days in a routine, exercises in a day. A superset split apart by a move releases the stray. */
function moveIn(arr, from, to){ const [x] = arr.splice(from, 1); arr.splice(to, 0, x); }
function normalizeGroups(list){
  const seen = new Set();
  list.forEach((e, i) => {
    if (!e.group || list[i - 1]?.group === e.group) return;
    if (seen.has(e.group)){ const old = e.group, g = 'G' + Date.now() + '-' + i; for (let k = i; list[k]?.group === old; k++) list[k].group = g; }
    seen.add(e.group);
  });
  const n = {}; list.forEach(e => { if (e.group) n[e.group] = (n[e.group] || 0) + 1; });
  list.forEach(e => { if (e.group && n[e.group] < 2) e.group = null; });
}
